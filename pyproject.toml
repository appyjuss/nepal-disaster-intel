[project]
name = "ndip"
version = "0.1.0"
description = "Nepal Disaster Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "pyarrow>=17",
  "pyiceberg[sql-sqlite,pyarrow,s3fs]>=0.8",
  "duckdb>=1.1",
  "shapely>=2.0",
  "geopandas>=1.0",
  "rasterio>=1.4",
  "rioxarray>=0.17",
  "odc-stac>=0.3.10",
  "xarray>=2024.9",
  "numpy>=2.0",
  "scipy>=1.14",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13", "respx>=0.21"]

[project.scripts]
ndip = "ndip.adapters.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndip"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits the network; deselect with -m 'not integration'"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ndip"]
